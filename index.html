<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>CarPlay Tube</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff3b30'/%3E%3Cpath d='M9 7l8 5-8 5z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=3f19882-mvfx8rmy">
</head>
<body>
  <div id="app">
    <header id="top">
    <nav id="rail" aria-label="Разделы">
      <button type="button" data-tab="home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Главная</span>
      </button>
      <button type="button" data-tab="subs">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zm2-4h12v2H6zm-2 8h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1zm6 3v6l5-3z"/></svg>
        <span>Подписки</span>
      </button>
      <button type="button" data-tab="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
        <span>Поиск</span>
      </button>
      <button type="button" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm8.6 5.2l2 1.6-2 3.4-2.4-.9a8 8 0 0 1-2 1.2L15.8 21h-4l-.4-2.5a8 8 0 0 1-2-1.2l-2.4.9-2-3.4 2-1.6a8 8 0 0 1 0-2.4l-2-1.6 2-3.4 2.4.9a8 8 0 0 1 2-1.2L11.8 3h4l.4 2.5a8 8 0 0 1 2 1.2l2.4-.9 2 3.4-2 1.6a8 8 0 0 1 0 2.4z" transform="translate(-1.8 0)"/></svg>
        <span>Настройки</span>
      </button>
    </nav>
    <div id="chips" role="toolbar" aria-label="Фильтры" hidden></div>
    </header>
    <main id="main">
      <div id="search-bar" hidden></div>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>

  <div id="player" hidden>
    <div id="yt"></div>
    <button type="button" id="p-shield" aria-label="Показать управление"></button>
    <div id="p-top">
      <p id="p-title"></p>
      <p id="p-channel"></p>
      <span id="p-time"></span>
    </div>
    <p id="p-status" hidden></p>
    <div id="p-bottom">
      <div id="p-progress"><div id="p-bar"></div></div>
      <div id="p-controls">
        <button type="button" id="p-back" class="pbtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6L8 12l7.4 7.4-1.4 1.4L5.2 12l8.8-8.8z"/></svg><span>Назад</span>
        </button>
        <button type="button" id="p-rew" class="pbtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6v12l-8.5-6zm9 0v12l-8.5-6z"/></svg><span>−10 с</span>
        </button>
        <button type="button" id="p-play" class="pbtn primary" data-state="paused">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          <span>Пуск</span>
        </button>
        <button type="button" id="p-fwd" class="pbtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6v12l8.5-6zM4 6v12l8.5-6z"/></svg><span>+30 с</span>
        </button>
      </div>
    </div>
  </div>

  <div id="toast" role="status" hidden></div>
  <script type="module" src="js/app.js?v=3f19882-mvfx8rmy"></script>
  <!-- After the app, so its wrappers sit outermost; see js/sniff.js. -->
  <script defer src="js/sniff.js?v=3f19882-mvfx8rmy"></script>
</body>
</html>
