<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Датчики шайбы</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 22px/1.3 -apple-system, system-ui, sans-serif; }
    #page { min-height: 100%; padding: 16px; box-sizing: border-box; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 14px; color: #a1a1a6; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .card { height: 130px; border-radius: 16px; background: #2c2c2e; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; transition: transform .12s; }
    .card.on { background: #3a3a3c; }
    .card.pressed { background: #34c759; color: #000; }
    /* Transparent, on top: APTV skips covered or opacity-0 elements, not transparent ones. */
    .sensor { position: fixed; z-index: 5; width: 24px; height: 24px; border: 0; padding: 0; border-radius: 16px; background: transparent; }
    body.show .sensor { background: rgba(10, 132, 255, .5); }
    #log { margin-top: 14px; white-space: pre-wrap; font: 16px/1.4 ui-monospace, Menlo, monospace; color: #d1d1d6; }
  </style>
</head>
<body>
  <div id="page">
    <h1>Датчики шайбы</h1>
    <p>Наклоняй шайбу: белая рамка должна ходить по клеткам ровно. Нажатие — клетка станет зелёной. У краёв наклон наружу должен уводить со страницы.</p>
    <div class="grid" id="grid"></div>
    <div id="log"></div>
  </div>

  <script>
    (function () {
      if (/show/.test(location.search)) document.body.classList.add('show');
      var RING = /rgb\(255,\s*64,\s*98\)/;
      var COLS = 3, ROWS = 3, STEP = 90;
      var grid = document.getElementById('grid');
      for (var i = 0; i < COLS * ROWS; i++) {
        var c = document.createElement('div');
        c.className = 'card';
        c.textContent = String(i + 1);
        grid.appendChild(c);
      }
      var cards = grid.children;
      var at = 0;
      var t0 = performance.now(), events = [], timer = 0;
      var session = 'sensor' + Date.now().toString(36).slice(-6);

      function note(line) {
        events.push(((performance.now() - t0) / 1000).toFixed(1) + '  ' + line);
        document.getElementById('log').textContent = events.slice(-10).reverse().join('\n');
        clearTimeout(timer);
        timer = setTimeout(function () {
          fetch('https://carplay-tube.carplay-tube-worker.workers.dev/api/report', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session: session, sensorTest: events, screen: innerWidth + 'x' + innerHeight, at: new Date().toISOString() }),
          }).catch(function () {});
        }, 3000);
      }

      // Five sensor buttons; whichever APTV rings is the centre, the others sit around it.
      var sensors = [];
      for (var k = 0; k < 5; k++) {
        var b = document.createElement('button');
        b.className = 'sensor';
        b.setAttribute('aria-label', 'Выбрать');
        b.addEventListener('click', function () { press(); });
        document.body.appendChild(b);
        sensors.push(b);
      }
      var center = sensors[0];
      var role = new Map(); // sensor → 'up' | 'down' | 'left' | 'right'

      function can(dir) {
        var r = Math.floor(at / COLS), c = at % COLS;
        return dir === 'up' ? r > 0 : dir === 'down' ? r < ROWS - 1 : dir === 'left' ? c > 0 : c < COLS - 1;
      }

      var GAP = 30;
      function layout() {
        var r = cards[at].getBoundingClientRect();
        var box = function (el, x, y, w, h) { el.style.left = x + 'px'; el.style.top = y + 'px'; el.style.width = w + 'px'; el.style.height = h + 'px'; };
        // The centre sensor covers the selected card: APTV's red ring outlines the card.
        box(center, r.left, r.top, r.width, r.height);
        role.clear();
        var others = sensors.filter(function (s) { return s !== center; });
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        [['up', cx - 12, r.top - GAP - 12], ['down', cx - 12, r.bottom + GAP - 12], ['left', r.left - GAP - 12, cy - 12], ['right', r.right + GAP - 12, cy - 12]].forEach(function (d, i) {
          var s = others[i];
          role.set(s, d[0]);
          box(s, d[1], d[2], 24, 24);
          // At an edge the sensor disappears, so APTV finds nothing there and leaves the page.
          if (can(d[0])) s.removeAttribute('aria-hidden'); else s.setAttribute('aria-hidden', 'true');
        });
      }

      function draw() {
        for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('on', i === at);
      }

      function move(dir) {
        if (!can(dir)) { note('край: ' + dir); return; }
        at += dir === 'up' ? -COLS : dir === 'down' ? COLS : dir === 'left' ? -1 : 1;
        note(dir + ' → ' + (at + 1));
        draw();
      }

      function press() {
        cards[at].classList.add('pressed');
        note('нажата ' + (at + 1));
        setTimeout(function () { cards[at] && cards[at].classList.remove('pressed'); }, 600);
      }

      new MutationObserver(function (records) {
        records.forEach(function (r) {
          var el = r.target;
          if (!RING.test(el.getAttribute('style') || '') || sensors.indexOf(el) < 0) return;
          if (el === center) { note('кольцо на центре'); return; }
          var dir = role.get(el);
          center = el;
          move(dir);
          layout();
        });
      }).observe(document.body, { subtree: true, attributes: true, attributeFilter: ['style'] });

      layout();
      draw();
      note('открыта ' + innerWidth + '×' + innerHeight);
    })();
  </script>
</body>
</html>
